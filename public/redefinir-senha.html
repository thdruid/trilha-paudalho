<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redefinir senha</title><link rel="stylesheet" href="/css/style.css"><main class="login-wrap"><section class="login-card"><h1>Nova senha</h1><p class="sub">Escolha uma senha com pelo menos 12 caracteres.</p><form id="form"><label for="senha">Nova senha</label><input id="senha" type="password" minlength="12" required><p class="login-error" id="erro"></p><button type="submit">Redefinir senha</button></form></section></main><script src="/js/api.js"></script><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();try{const token=new URLSearchParams(location.search).get('token');await api('/auth/redefinir-senha',{method:'POST',body:JSON.stringify({token,senha:document.getElementById('senha').value})});location.href='/index.html'}catch(x){document.getElementById('erro').textContent=x.message}})</script></html>
