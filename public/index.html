<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101b30">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Trilha Paudalho — Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="login-wrap">
    <section class="login-card" aria-labelledby="titulo-login">
      <h1 id="titulo-login">Trilha Paudalho</h1>
      <p class="sub">BNCC Computação · Rede Municipal de Paudalho</p>

      <form id="loginForm">
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="email" required>

        <label for="senha">Senha</label>
        <input id="senha" type="password" autocomplete="current-password" required>

        <p id="loginError" class="login-error" role="alert"></p>
        <button type="submit" class="btn-primary">Entrar</button>
      </form>

      <div class="demo-users">
        <p>Contas de demonstração — use a senha fornecida pela equipe responsável.</p>
        <button type="button" data-email="mariajulia@aluno.paudalho.pe.gov.br">Acessar como aluna</button>
        <button type="button" data-email="carlos.andrade@seduc.paudalho.pe.gov.br">Acessar como professor</button>
        <button type="button" data-email="gestao@seduc.paudalho.pe.gov.br">Acessar como gestão</button>
      </div>
      <p class="tag"><a href="#" id="recoverPassword">Esqueci minha senha</a></p>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const usuarioAtual = Sessao.usuario();
    if (Sessao.token() && usuarioAtual) {
      window.location.href = `/${usuarioAtual.papel === 'gestor' ? 'gestao' : usuarioAtual.papel}.html`;
    }

    document.querySelectorAll('.demo-users button').forEach((botao) => {
      botao.addEventListener('click', () => {
        document.getElementById('email').value = botao.dataset.email;
        document.getElementById('senha').focus();
      });
    });

    document.getElementById('loginForm').addEventListener('submit', async (evento) => {
      evento.preventDefault();
      const erro = document.getElementById('loginError');
      erro.textContent = '';

      try {
        const dados = await api('/auth/login', {
          method: 'POST',
          body: JSON.stringify({
            email: document.getElementById('email').value,
            senha: document.getElementById('senha').value
          })
        });
        Sessao.salvar(dados.token, dados.usuario);
        window.location.href = `/${dados.usuario.papel === 'gestor' ? 'gestao' : dados.usuario.papel}.html`;
      } catch (falha) {
        erro.textContent = falha.message || 'Não foi possível entrar. Tente novamente.';
      }
    });
    document.getElementById('recoverPassword').addEventListener('click', async (evento) => {
      evento.preventDefault();
      const email = document.getElementById('email').value.trim();
      const erro = document.getElementById('loginError');
      if (!email) { erro.textContent = 'Informe seu e-mail para recuperar a senha.'; return; }
      try { const resposta = await api('/auth/recuperar-senha', { method: 'POST', body: JSON.stringify({ email }) }); erro.textContent = resposta.mensagem; } catch (falha) { erro.textContent = falha.message; }
    });
  </script>
</body>
</html>
